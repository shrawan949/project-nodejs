version: '3.8'

services:
  web:
    build: .
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/nexus_ecommerce
      - JWT_SECRET=super_secret_jwt_key_nexus_ecommerce_2026_enterprise_production
      - JWT_EXPIRE=30d
      - COOKIE_EXPIRE=30
      - ADMIN_EMAIL=admin@nexus-shop.com
      - ADMIN_PASSWORD=AdminSecure2026!
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nexus-network

  mongo:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nexus-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: nexus-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongo
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
