apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-app-deployment
  namespace: nexus-ecommerce
  labels:
    app: nexus-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-app
  template:
    metadata:
      labels:
        app: nexus-app
    spec:
      containers:
      - name: nexus-app
        image: node:20-alpine
        command: ["sh", "-c", "npm install && node src/utils/seeder.js && npm start"]
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: nexus-config
        - secretRef:
            name: nexus-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-app-service
  namespace: nexus-ecommerce
spec:
  type: NodePort
  selector:
    app: nexus-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
